<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./main.js" defer></script>
</head>
<body>
    <main>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl shadow-md p-6">
                <h3 class="text-lg font-bold text-slate-900">Distance</h3>
                <p class="text-sm text-slate-500 mt-1">Miles to kilometers</p>
                <label for="miles-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
                    Miles
                </label>
                <input id="miles-input" type="number" value="0" class="w-full rounded-lg border-slate-300 px-4 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none"/>
                <button id="miles-button" class="w-full mt-4 rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700 transition cursor-pointer">
                    Convert
                </button>
                <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                    <p class="text-xs uppercase tracking-wide text-slate-500">Kilometers</p>
                    <p id="miles-result" class="text-2xl font-bold text-emerald-600 mt-1">0.00</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
