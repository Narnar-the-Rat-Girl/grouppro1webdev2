<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100">
    <header class ="flex items-center justify-between ">
      <nav
        class="bg-neutral-primary w-full start-0 border-b border-default p-2.5"
      >
        <ul class="flex gap-4">
          <li class="me-2">
            <a class="text-red-500 hover:text-red-800 font-bold" href="weight.html">Weight</a>
          </li>
          <li class="me-2">
            <a class="text-green-500 hover:text-green-800 font-bold" href="distance.html">Distance</a>
          </li>
          <li class="me-2">
            <a class="text-purple-500 hover:text-purple-800 font-bold" href="temp.html">Temperature</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="container mx-auto p-4 ">
      <div class = "flex items-center justify-center flex-col p-5">
        <h1 class="font-bold mb-4 text-3xl">Temperature Converter</h1>
        <p>Enter values with "," in between to convert!</p>
      </div>
      <div class = "flex items-center justify-center gap-8">
        <!-- Celsius to Fahrenheit -->
        <div class="bg-slate-200 flex flex-col p-5 gap-5 rounded-lg shadow">
          <h2 class="font-medium text-lg">Celsius to Fahrenheit</h2>
          <label for="celsius-input">Celsius</label>
          <input
                id="celsius-input"
                type="string"
                value="0"
                class="rounded-lg border px-4 py-2 text-slate-900-500"
              />
            <button
              id="fahrenheit-button"
              class=" mt-1 rounded-lg bg-purple-600 px-2 py-2.5 font-semibold text-red-300 hover:bg-red-700 cursor-pointer">
              Convert to Fahrenheit
            </button>
            <p
                id="fahrenheit-result"
                class="text-2xl font-bold text-purple-600 mt-1">
                0.00
              </p>
        </div>
        <!-- Fahrenheit to Celsius -->
        <div class="bg-slate-200 flex flex-col p-5 gap-5 rounded-lg shadow">
          <h2 class="font-medium text-lg">Fahrenheit to Celsius</h2>
          <label for="fahrenheit-input" class="block mb-2">Fahrenheit</label>
          <input
                id="fahrenheit-input"
                type="string"
                value="0"
                class="rounded-lg border px-4 py-2 text-slate-900-500"/>
                <button
                    id="celsius-button"
                    class=" mt-1 rounded-lg bg-purple-600 px-2 py-2.5 font-semibold text-red-300 hover:bg-purple-700 cursor-pointer">
                    Convert to Celsius
                </button>
                <p
                id="celsius-result"
                class="text-2xl font-bold text-purple-600 mt-1">
                0.00
              </p>
          </div>
       </div>
    </main>
    <script src="temperature.js"></script>
  </body>
</html>
