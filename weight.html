<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unit Converter</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100">
    <header class ="flex items-center justify-between ">
      <nav
        class="bg-neutral-primary w-full start-0 border-b border-default p-2.5"
      >
        <ul class="flex">
          <li class="me-2">
            <a class="text-red-500 hover:text-red-800" href="weight.html">Weight</a>
          </li>
          <li class="me-2">
            <a class="text-green-500 hover:text-green-800" href="distance.html">Distance</a>
          </li>
          <li class="me-2">
            <a class="text-purple-500 hover:text-purple-800" href="temp.html">Temp</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="container mx-auto p-4 ">
      <h1 class="font-bold mb-4">Weight Converter</h1>
      <div class = "flex items-center justify-between">
      <div>
        
      <label for="pounds-input" class="block mb-2">pounds</label>
      <input
            id="pounds-input"
            type="number"
            value="0"
            class="rounded-lg border px-4 py-2 text-slate-900-500"
          />
      </div>
      <div>
      <label for="kg-input" class="block mb-2">kilograms</label>
      <input
            id="kg-input"
            type="string"
            value="0"
            class="rounded-lg border px-4 py-2 text-slate-900-500"
          />
      </div>
      </div>
      <div class = "flex items-center justify-between">
                  <button
            id="kg-button"
            class=" mt-1 rounded-lg bg-red-600 px-2 py-2.5 font-semibold text-red-300 hover:bg-red-700 cursor-pointer"
          >
            convert to kg
          </button>
        <button
            id="pounds-button"
            class=" mt-1 rounded-lg bg-red-600 px-2 py-2.5 font-semibold text-red-300 hover:bg-red-700 cursor-pointer"
          >
            convert to pounds
          </button>

      </div>
       <p
              id="weight-result"
              class="text-2xl font-bold text-red-600 mt-1"
            >
              0.00
            </p>
      
      

    </main>
    <script src="main.js"></script>
  </body>
</html>
